-->
<html lang="es">
<head>

    <title>SIGSM - Documentos</title>

<script src="../js/auth.js"></script>


<script>

/*

document.addEventListener(
    'DOMContentLoaded',
    async () => {

        const autorizado =
            await verificarSesion();


        if (!autorizado) {

            return;

        }

    }
);

</script>
