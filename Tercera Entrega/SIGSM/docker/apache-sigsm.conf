ServerTokens Prod
ServerSignature Off
<Directory /var/www/html/SIGSM3>
    Options -Indexes -MultiViews
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/www/html/SIGSM3/Backend>
    Require all denied
</Directory>
<Directory /var/www/html/SIGSM3/Docker>
    Require all denied
</Directory>
<Directory /var/www/html/SIGSM3/docker>
    Require all denied
</Directory>
<Directory /var/www/html/SIGSM3/uploads>
    Require all denied
</Directory>
<FilesMatch "^(\.env.*|Dockerfile|compose\.ya?ml|docker-compose\.ya?ml|.*\.sql)$">
    Require all denied
</FilesMatch>
