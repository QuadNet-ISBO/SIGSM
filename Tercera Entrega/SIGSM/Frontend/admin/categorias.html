<script>
/* Convierte datos externos en texto seguro para plantillas HTML. */
function escaparHTMLSeguro(valor) {
    return String(valor ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}




/*
 * ============================================================
 * CARGAR CATEGORÍAS
 * ============================================================
 */

async function cargarCategorias() {

    const tabla =
        document.getElementById(
            'tablaCategorias'
        );


    try {

        const respuesta =
            await fetch(
                '../../API/categorias/listar.php',
                {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                }
            );


        const datos =
            await respuesta.json();


        if (
            !respuesta.ok ||
            !datos.ok
        ) {

            tabla.innerHTML = `

                <tr>

                    <td colspan="5">

                        ${escaparHTMLSeguro(datos.mensaje || 'No se pudieron cargar las categorías.')}

                    </td>

                </tr>

            `;

            return;

        }


        tabla.innerHTML = '';


        if (
            !datos.categorias ||
            datos.categorias.length === 0
        ) {

            tabla.innerHTML = `

                <tr>

                    <td colspan="5">
                        No hay categorías registradas.
                    </td>

                </tr>

            `;

            return;

        }


        datos.categorias.forEach(
            categoria => {


                /*
                 * Clase visual del estado.
                 */

                const claseEstado =
                    categoria.estado === 'activa'
                        ? 'activo'
                        : 'inactivo';


                /*
                 * Texto del botón.
                 */

                const textoBoton =
                    categoria.estado === 'activa'
                        ? 'Desvincular'
                        : 'Activar';


                const fila =
                    document.createElement('tr');


                fila.innerHTML = `

                    <td>
                        ${escaparHTMLSeguro(categoria.id_categoria)}
                    </td>

                    <td>
                        ${escaparHTMLSeguro(categoria.nombre)}
                    </td>

                    <td>

                        <span
                            class="estado ${claseEstado}"
                        >
                            ${escaparHTMLSeguro(categoria.estado)}
                        </span>

                    </td>

                    <td>

                        <a
                            href="categorias_editar.html?id=${escaparHTMLSeguro(categoria.id_categoria)}"
                        >

                            <button
                                type="button"
                                class="btn-secondary"
                            >
                                Editar
                            </button>

                        </a>

                    </td>

                    <td>

                        <button
                            type="button"
                            class="btn-danger"
                        >
                            ${textoBoton}
                        </button>

                    </td>

                `;


                const botonEstado = fila.querySelector('button.btn-danger');
                botonEstado.addEventListener('click', () =>
                    cambiarEstado(categoria.id_categoria, categoria.estado)
                );

                tabla.appendChild(
                    fila
                );

            }
        );


    } catch (error) {

        console.error(
            'Error al cargar categorías:',
            error
        );


        tabla.innerHTML = `

            <tr>

                <td colspan="5">
                    No se pudo conectar con el servidor.
                </td>

            </tr>

        `;

    }

}


/*
 * ============================================================
 * CAMBIAR ESTADO
 * ============================================================
 */

async function cambiarEstado(
    idCategoria,
    estadoActual
) {


    const nuevoEstado =
        estadoActual === 'activa'
            ? 'desvinculada'
            : 'activa';


    const confirmar =
        confirm(
            `¿Desea cambiar el estado de la categoría a "${nuevoEstado}"?`
        );


    if (!confirmar) {

        return;

    }


    try {

        const respuesta =
            await fetch(
                '../../API/categorias/estado.php',
                {
                    method: 'PATCH',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    credentials:
                        'same-origin',

                    body:
                        JSON.stringify({

                            id_categoria:
                                idCategoria,

                            estado:
                                nuevoEstado

                        })
                }
            );


        const datos =
            await respuesta.json();


        if (
            !respuesta.ok ||
            !datos.ok
        ) {

            alert(
                datos.mensaje ||
                'No se pudo cambiar el estado.'
            );

            return;

        }


        cargarCategorias();


    } catch (error) {

        console.error(
            error
        );


        alert(
            'No se pudo conectar con el servidor.'
        );

    }

}


/*
 * ============================================================
 * SEGURIDAD + CARGA INICIAL
 * ============================================================
 */

verificarAdministrador()
    .then(autorizado => {

        if (autorizado) {

            cargarCategorias();

        }

    });


</script>
