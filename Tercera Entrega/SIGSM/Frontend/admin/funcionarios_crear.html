<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>SIGSM - Agregar Funcionario</title>

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >
    <link rel="stylesheet" href="../css/tema.css">

    <script src="../js/csrf.js"></script>
</head>


<body>

<!-- ================= SIDEBAR ================= -->

<div class="sidebar"></div>

<!-- ================= CONTENIDO ================= -->

<div class="main">


    <div class="header">

        <div class="header-left">

            <h2>
                Agregar Funcionario
            </h2>

        </div>


        <div class="header-right">

            <span class="user">
                Cargando...
            </span>

            <span class="role">
                Cargando...
            </span>

            <button
                class="logout"
                id="btnLogout"
                type="button"
            >
                Salir
            </button>

        </div>

    </div>


    <div class="content">

        <h2 class="titulo-seccion">
            Agregar Funcionario
        </h2>


        <div class="card card-medium">

            <form
                class="form"
                id="crearFuncionarioForm"
            >


                <div class="form-group">

                    <label for="ci">
                        CI
                    </label>

                    <input
                        type="text"
                        id="ci"
                        name="ci"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                    >

                </div>


                <div class="form-group">

                    <label for="horario">
                        Horario
                    </label>

                    <select
                        id="horario"
                        name="horario"
                        required
                    >

                        <option value="">
                            Seleccione un horario
                        </option>

                        <option value="Matutino">
                            Matutino
                        </option>

                        <option value="Diurno">
                            Diurno
                        </option>

                        <option value="Vespertino">
                            Vespertino
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="tipo">
                        Tipo
                    </label>

                    <select
                        id="tipo"
                        name="tipo"
                        required
                    >

                        <option value="">
                            Seleccione un tipo
                        </option>

                        <option value="chofer">
                            Chofer
                        </option>

                        <option value="enfermero">
                            Enfermero
                        </option>

                        <option value="ambos">
                            Chofer y Enfermero
                        </option>

                    </select>

                </div>


                <p
                    id="mensaje"
                    role="alert"
                ></p>

                <div class="acciones-form">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Crear funcionario
                    </button>

                    <a href="funcionarios.html">
                        <button
                            type="button"
                            class="btn-secondary"
                        >
                            Volver
                        </button>
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- ================= Sidebar ================= -->

<script src="../js/admin-sidebar.js"></script>

<!-- ================= SEGURIDAD ================= -->

<script src="../js/admin-auth.js"></script>

<!-- ================= JS PROPIO ================= -->

<script>

const formulario =
    document.getElementById(
        'crearFuncionarioForm'
    );


const mensaje =
    document.getElementById(
        'mensaje'
    );


/*
 * Crear funcionario.
 */
formulario.addEventListener(
    'submit',
    async evento => {

        evento.preventDefault();

        mensaje.textContent = '';


        const ci =
            document
                .getElementById('ci')
                .value
                .trim();


        const nombre =
            document
                .getElementById('nombre')
                .value
                .trim();


        const apellido =
            document
                .getElementById('apellido')
                .value
                .trim();


        const telefono =
            document
                .getElementById('telefono')
                .value
                .trim();


        const horario =
            document
                .getElementById('horario')
                .value;


        const tipo =
            document
                .getElementById('tipo')
                .value;


        /*
         * Validación.
         */
        if (
            ci === '' ||
            nombre === '' ||
            apellido === '' ||
            horario === '' ||
            tipo === ''
        ) {

            mensaje.textContent =
                'Complete todos los campos obligatorios.';

            return;

        }


        /*
         * Determinar permisos.
         */
        let puedeSerChofer = false;
        let puedeSerEnfermero = false;


        if (tipo === 'chofer') {

            puedeSerChofer = true;

        }


        if (tipo === 'enfermero') {

            puedeSerEnfermero = true;

        }


        if (tipo === 'ambos') {

            puedeSerChofer = true;
            puedeSerEnfermero = true;

        }


        try {

            const respuesta =
                await fetch(
                    '../../API/funcionarios/crear.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials:
                            'same-origin',

                        body:
                            JSON.stringify({

                                ci:
                                    ci,

                                nombre:
                                    nombre,

                                apellido:
                                    apellido,

                                telefono:
                                    telefono === ''
                                        ? null
                                        : telefono,

                                horario:
                                    horario,

                                puede_ser_chofer:
                                    puedeSerChofer,

                                puede_ser_enfermero:
                                    puedeSerEnfermero

                            })
                    }
                );


            const datos =
                await respuesta.json();


            if (
                !respuesta.ok ||
                !datos.ok
            ) {

                mensaje.textContent =
                    datos.mensaje ||
                    'No se pudo crear el funcionario.';

                return;

            }


            mensaje.textContent =
                'Funcionario creado correctamente.';


            formulario.reset();


            setTimeout(
                () => {

                    window.location.replace(
                        'funcionarios.html'
                    );

                },
                1000
            );


        } catch (error) {

            console.error(
                'Error:',
                error
            );


            mensaje.textContent =
                'No se pudo conectar con el servidor.';

        }

    }
);


/*
 * Seguridad.
 */
verificarAdministrador();

</script>



    <script src="../js/preferencias.js"></script>
    <script src="../js/header.js"></script>
</body>

</html>
