<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>SIGSM - Editar Funcionario</title>

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >
    <link rel="stylesheet" href="../css/tema.css">

    <script src="../js/csrf.js"></script>
</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar"></div>


<!-- ================= CONTENIDO ================= -->

<div class="main">


    <div class="header">

        <div class="header-left">

            <h2>
                Editar Funcionario
            </h2>

        </div>


        <div class="header-right">

            <span class="user">
                Cargando...
            </span>

            <span class="role">
                Cargando...
            </span>

            <button
                class="logout"
                id="btnLogout"
                type="button"
            >
                Salir
            </button>

        </div>

    </div>


    <div class="content">

        <h2 class="titulo-seccion">
            Editar Funcionario
        </h2>


        <div class="card card-medium">

            <form
                class="form"
                id="editarFuncionarioForm"
            >


                <div class="form-group">

                    <label for="ci">
                        CI
                    </label>

                    <input
                        type="text"
                        id="ci"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                    >

                </div>


                <div class="form-group">

                    <label for="horario">
                        Horario
                    </label>

                    <select
                        id="horario"
                        required
                    >

                        <option value="Matutino">
                            Matutino
                        </option>

                        <option value="Diurno">
                            Diurno
                        </option>

                        <option value="Vespertino">
                            Vespertino
                        </option>

                    </select>
                    <p id="avisoHorarioOcupado" hidden role="status">El horario no puede modificarse mientras el funcionario esté asignado a un traslado activo.</p>

                </div>


                <div class="form-group">

                    <label for="tipo">
                        Tipo
                    </label>

                    <select
                        id="tipo"
                        required
                    >

                        <option value="chofer">
                            Chofer
                        </option>

                        <option value="enfermero">
                            Enfermero
                        </option>

                        <option value="ambos">
                            Chofer y Enfermero
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="estado_laboral">
                        Estado laboral
                    </label>

                    <select
                        id="estado_laboral"
                        required
                    >

                        <option value="activo">
                            Activo
                        </option>

                        <option value="inactivo">
                            Inactivo
                        </option>

                        <option value="desvinculado">
                            Desvinculado
                        </option>

                    </select>

                </div>


                <p
                    id="mensaje"
                    role="alert"
                ></p>


                <div class="acciones-form">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Guardar cambios
                    </button>


                    <a href="funcionarios.html">

                        <button
                            type="button"
                            class="btn-secondary"
                        >
                            Volver
                        </button>

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>

<!-- ================= Sidebar ================= -->

<script src="../js/admin-sidebar.js"></script>

<!-- ================= SEGURIDAD ================= -->

<script src="../js/admin-auth.js"></script>

<!-- ================= JS PROPIO ================= -->
 
<script>
    /*
 * ============================================================
 * EDITAR FUNCIONARIO
 * ============================================================
 */


const formulario =
    document.getElementById(
        'editarFuncionarioForm'
    );


const mensaje =
    document.getElementById(
        'mensaje'
    );


/*
 * Obtiene el ID desde la URL.
 *
 * funcionarios_editar.html?id=1
 */
const parametros =
    new URLSearchParams(
        window.location.search
    );


const idFuncionario =
    parametros.get('id');


/*
 * Determina el tipo según los booleanos.
 */
function determinarTipo(funcionario) {

    if (
        funcionario.puede_ser_chofer &&
        funcionario.puede_ser_enfermero
    ) {

        return 'ambos';

    }


    if (
        funcionario.puede_ser_chofer
    ) {

        return 'chofer';

    }


    if (
        funcionario.puede_ser_enfermero
    ) {

        return 'enfermero';

    }


    return '';

}


/*
 * Carga el funcionario.
 */
async function cargarFuncionario() {

    try {

        const respuesta =
            await fetch(
                '../../API/funcionarios/obtener.php?id=' +
                encodeURIComponent(idFuncionario),
                {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                }
            );


        const datos =
            await respuesta.json();


        if (
            !respuesta.ok ||
            !datos.ok
        ) {

            mensaje.textContent =
                datos.mensaje ||
                'No se pudo cargar el funcionario.';

            return;

        }


        const funcionario =
            datos.funcionario;


        document.getElementById(
            'ci'
        ).value =
            funcionario.ci;


        document.getElementById(
            'nombre'
        ).value =
            funcionario.nombre;


        document.getElementById(
            'apellido'
        ).value =
            funcionario.apellido;


        document.getElementById(
            'telefono'
        ).value =
            funcionario.telefono ?? '';


        document.getElementById(
            'horario'
        ).value =
            funcionario.horario ?? '';


        const horarioSelector = document.getElementById('horario');
        const ocupado = funcionario.estado_operativo === 'ocupado';
        horarioSelector.disabled = ocupado;
        document.getElementById('avisoHorarioOcupado').hidden = !ocupado;

        document.getElementById(
            'tipo'
        ).value =
            determinarTipo(funcionario);


        document.getElementById(
            'estado_laboral'
        ).value =
            funcionario.estado_laboral;


    } catch (error) {

        console.error(error);


        mensaje.textContent =
            'No se pudo conectar con el servidor.';

    }

}


/*
 * Guarda los cambios.
 */
formulario.addEventListener(
    'submit',
    async evento => {

        evento.preventDefault();


        mensaje.textContent = '';


        const ci =
            document
                .getElementById('ci')
                .value
                .trim();


        const nombre =
            document
                .getElementById('nombre')
                .value
                .trim();


        const apellido =
            document
                .getElementById('apellido')
                .value
                .trim();


        const telefono =
            document
                .getElementById('telefono')
                .value
                .trim();


        const horario =
            document
                .getElementById('horario')
                .value;


        const tipo =
            document
                .getElementById('tipo')
                .value;


        const estadoLaboral =
            document
                .getElementById('estado_laboral')
                .value;


        /*
         * Validación.
         */
        if (
            ci === '' ||
            nombre === '' ||
            apellido === '' ||
            horario === '' ||
            tipo === '' ||
            estadoLaboral === ''
        ) {

            mensaje.textContent =
                'Complete todos los campos obligatorios.';

            return;

        }


        let puedeSerChofer = false;
        let puedeSerEnfermero = false;


        if (tipo === 'chofer') {

            puedeSerChofer = true;

        }


        if (tipo === 'enfermero') {

            puedeSerEnfermero = true;

        }


        if (tipo === 'ambos') {

            puedeSerChofer = true;
            puedeSerEnfermero = true;

        }


        try {

            const respuesta =
                await fetch(
                    '../../API/funcionarios/actualizar.php',
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials:
                            'same-origin',

                        body:
                            JSON.stringify({

                                id_funcionario:
                                    Number(idFuncionario),

                                ci:
                                    ci,

                                nombre:
                                    nombre,

                                apellido:
                                    apellido,

                                telefono:
                                    telefono === ''
                                        ? null
                                        : telefono,

                                horario:
                                    horario,

                                estado_laboral:
                                    estadoLaboral,

                                puede_ser_chofer:
                                    puedeSerChofer,

                                puede_ser_enfermero:
                                    puedeSerEnfermero

                            })
                    }
                );


            const datos =
                await respuesta.json();


            if (
                !respuesta.ok ||
                !datos.ok
            ) {

                mensaje.textContent =
                    datos.mensaje ||
                    'No se pudieron guardar los cambios.';

                return;

            }


            mensaje.textContent =
                'Funcionario actualizado correctamente.';


            setTimeout(
                () => {

                    window.location.replace(
                        'funcionarios.html'
                    );

                },
                1000
            );


        } catch (error) {

            console.error(error);


            mensaje.textContent =
                'No se pudo conectar con el servidor.';

        }

    }
);


/*
 * Seguridad + carga.
 */
verificarAdministrador()
    .then(autorizado => {

        if (!autorizado) {

            return;

        }


        if (!idFuncionario) {

            mensaje.textContent =
                'No se indicó el funcionario a editar.';

            return;

        }


        cargarFuncionario();

    });
</script>


    <script src="../js/preferencias.js"></script>
    <script src="../js/header.js"></script>
</body>

</html>
