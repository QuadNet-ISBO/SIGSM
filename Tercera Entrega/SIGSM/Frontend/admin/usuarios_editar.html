<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>SIGSM - Editar Usuario</title>

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >
    <link rel="stylesheet" href="../css/tema.css">

    <script src="../js/csrf.js"></script>
</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar"></div>


<!-- ================= CONTENIDO ================= -->

<div class="main">


    <div class="header">

        <div class="header-left">

            <h2>
                Editar Usuario
            </h2>

        </div>


        <div class="header-right">

            <span class="user">
                Cargando...
            </span>

            <span class="role">
                Cargando...
            </span>

            <button
                class="logout"
                id="btnLogout"
                type="button"
            >
                Salir
            </button>

        </div>

    </div>


    <div class="content">

        <h2 class="titulo-seccion">
            Editar Usuario
        </h2>


        <div class="card card-medium">

            <form
                class="form"
                id="editarUsuarioForm"
            >


                <div class="form-group">

                    <label for="user">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="ci">
                        CI
                    </label>

                    <input
                        type="text"
                        id="ci"
                        name="ci"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        placeholder="Nueva contraseña (opcional)"
                    >

                </div>


                <div class="form-group">

                    <label for="id_rol">
                        Rol
                    </label>

                    <select
                        id="id_rol"
                        name="id_rol"
                        required
                    >

                        <option value="">
                            Seleccione un rol
                        </option>

                        <option value="1">
                            Administrador
                        </option>

                        <option value="2">
                            Operador
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="estado_laboral">
                        Estado laboral
                    </label>

                    <select
                        id="estado_laboral"
                        name="estado_laboral"
                        required
                    >

                        <option value="activo">
                            Activo
                        </option>

                        <option value="inactivo">
                            Inactivo
                        </option>

                        <option value="desvinculado">
                            Desvinculado
                        </option>

                    </select>

                </div>


                <p
                    id="mensaje"
                    role="alert"
                ></p>


                <div class="acciones-form">


                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Guardar cambios
                    </button>


                    <a href="usuarios.html">

                        <button
                            type="button"
                            class="btn-secondary"
                        >
                            Volver
                        </button>

                    </a>


                </div>


            </form>

        </div>

    </div>

</div>

<!-- ================= Sidebar ================= -->

<script src="../js/admin-sidebar.js"></script>

<!-- ================= SEGURIDAD ================= -->

<script src="../js/admin-auth.js"></script>

<!-- ================= JS PROPIO ================= -->

<script>


const formulario =
    document.getElementById(
        'editarUsuarioForm'
    );


const mensaje =
    document.getElementById(
        'mensaje'
    );


const parametros =
    new URLSearchParams(
        window.location.search
    );


const idUsuario =
    parametros.get('id');


/*
 * Carga los datos del usuario.
 */
async function cargarUsuario() {

    try {

        const respuesta =
            await fetch(
                '../../API/usuarios/obtener.php?id=' +
                encodeURIComponent(idUsuario),
                {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                }
            );


        const datos =
            await respuesta.json();


        if (
            !respuesta.ok ||
            !datos.ok
        ) {

            mensaje.textContent =
                datos.mensaje ||
                'No se pudo cargar el usuario.';

            return;
        }


        const usuario =
            datos.usuario;


        document.getElementById('user').value =
            usuario.user;


        document.getElementById('ci').value =
            usuario.ci;


        document.getElementById('nombre').value =
            usuario.nombre;


        document.getElementById('apellido').value =
            usuario.apellido;


        document.getElementById('telefono').value =
            usuario.telefono ?? '';


        document.getElementById('email').value =
            usuario.email;


        document.getElementById('id_rol').value =
            usuario.id_rol;


        document.getElementById(
            'estado_laboral'
        ).value =
            usuario.estado_laboral;


    } catch (error) {

        console.error(
            error
        );


        mensaje.textContent =
            'No se pudo conectar con el servidor.';

    }

}


/*
 * Guarda los cambios.
 */
formulario.addEventListener(
    'submit',
    async (evento) => {

        evento.preventDefault();


        mensaje.textContent = '';


        const datos = {

            id_usuario:
                Number(idUsuario),

            ci:
                document
                    .getElementById('ci')
                    .value
                    .trim(),

            nombre:
                document
                    .getElementById('nombre')
                    .value
                    .trim(),

            apellido:
                document
                    .getElementById('apellido')
                    .value
                    .trim(),

            telefono:
                document
                    .getElementById('telefono')
                    .value
                    .trim()
                || null,

            email:
                document
                    .getElementById('email')
                    .value
                    .trim(),

            user:
                document
                    .getElementById('user')
                    .value
                    .trim(),

            id_rol:
                Number(
                    document
                        .getElementById('id_rol')
                        .value
                ),

            estado_laboral:
                document
                    .getElementById(
                        'estado_laboral'
                    )
                    .value,

            password:
                document
                    .getElementById('password')
                    .value

        };


        if (
            datos.ci === '' ||
            datos.nombre === '' ||
            datos.apellido === '' ||
            datos.email === '' ||
            datos.user === '' ||
            !datos.id_rol ||
            datos.estado_laboral === ''
        ) {

            mensaje.textContent =
                'Complete todos los campos obligatorios.';

            return;
        }


        if (
            !datos.email.includes('@')
        ) {

            mensaje.textContent =
                'Ingrese un email válido.';

            return;
        }


        if (
            datos.password !== '' &&
            datos.password.length < 8
        ) {

            mensaje.textContent =
                'La contraseña debe tener al menos 8 caracteres.';

            return;
        }


        try {

            const respuesta =
                await fetch(
                    '../../API/usuarios/actualizar.php',
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials:
                            'same-origin',

                        body:
                            JSON.stringify(datos)
                    }
                );


            const resultado =
                await respuesta.json();


            if (
                !respuesta.ok ||
                !resultado.ok
            ) {

                mensaje.textContent =
                    resultado.mensaje ||
                    'No se pudieron guardar los cambios.';

                return;
            }


            mensaje.textContent =
                'Usuario actualizado correctamente.';


            setTimeout(() => {

                window.location.replace(
                    'usuarios.html'
                );

            }, 1500);


        } catch (error) {

            console.error(
                error
            );


            mensaje.textContent =
                'No se pudo conectar con el servidor.';

        }

    }
);


/*
 * Verifica seguridad y después
 * carga el usuario.
 */
verificarAdministrador()
    .then(autorizado => {

        if (!autorizado) {
            return;
        }


        if (!idUsuario) {

            mensaje.textContent =
                'No se indicó el usuario a editar.';

            return;
        }


        cargarUsuario();

    });


</script>


    <script src="../js/preferencias.js"></script>
    <script src="../js/header.js"></script>
</body>

</html>
