<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>SIGSM - Editar Vehículo</title>

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >
    <link rel="stylesheet" href="../css/tema.css">

    <script src="../js/csrf.js"></script>
</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar"></div>


<!-- ================= CONTENIDO ================= -->

<div class="main">


    <div class="header">

        <div class="header-left">

            <h2>
                Editar Vehículo
            </h2>

        </div>


        <div class="header-right">

            <span class="user">
                Cargando...
            </span>

            <span class="role">
                Cargando...
            </span>

            <button
                class="logout"
                id="btnLogout"
                type="button"
            >
                Salir
            </button>

        </div>

    </div>


    <div class="content">

        <h2 class="titulo-seccion">
            Editar Vehículo
        </h2>


        <div class="card card-medium">

            <form
                class="form"
                id="editarVehiculoForm"
            >


                <div class="form-group">

                    <label for="matricula">
                        Matrícula
                    </label>

                    <input
                        type="text"
                        id="matricula"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="tipo">
                        Tipo
                    </label>

                    <select
                        id="tipo"
                        required
                    >

                        <option value="">
                            Cargando tipos...
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="estado_laboral">
                        Estado laboral
                    </label>

                    <select
                        id="estado_laboral"
                        required
                    >

                        <option value="activo">
                            Activo
                        </option>

                        <option value="inactivo">
                            Inactivo
                        </option>

                        <option value="desvinculado">
                            Desvinculado
                        </option>

                    </select>

                </div>


                <p
                    id="mensaje"
                    role="alert"
                ></p>


                <div class="acciones-form">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Guardar cambios
                    </button>


                    <a href="vehiculos.html">

                        <button
                            type="button"
                            class="btn-secondary"
                        >
                            Volver
                        </button>

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>

<!-- ================= Sidebar ================= -->

<script src="../js/admin-sidebar.js"></script>

<!-- ================= SEGURIDAD ================= -->

<script src="../js/admin-auth.js"></script>

<!-- ================= JS PROPIO ================= -->

<script>


const formulario =
    document.getElementById(
        'editarVehiculoForm'
    );


const mensaje =
    document.getElementById(
        'mensaje'
    );


const selectTipo =
    document.getElementById(
        'tipo'
    );


/*
 * Obtiene el ID desde la URL.
 *
 * vehiculos_editar.html?id=1
 */
const parametros =
    new URLSearchParams(
        window.location.search
    );


const idVehiculo =
    parametros.get('id');


/*
 * ============================================================
 * CARGAR TIPOS
 * ============================================================
 */
async function cargarTipos() {

    try {

        const respuesta =
            await fetch(
                '../../API/vehiculos/listar_tipos.php',
                {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                }
            );


        const datos =
            await respuesta.json();


        if (
            !respuesta.ok ||
            !datos.ok
        ) {

            mensaje.textContent =
                datos.mensaje ||
                'No se pudieron cargar los tipos.';

            return false;

        }


        selectTipo.innerHTML = `
            <option value="">
                Seleccione un tipo
            </option>
        `;


        datos.tipos.forEach(
            tipo => {

                const opcion =
                    document.createElement(
                        'option'
                    );


                opcion.value =
                    tipo.id_tipo_vehiculo;


                opcion.textContent =
                    tipo.nombre;


                selectTipo.appendChild(
                    opcion
                );

            }
        );


        return true;


    } catch (error) {

        console.error(error);


        mensaje.textContent =
            'No se pudieron cargar los tipos de vehículo.';

        return false;

    }

}


/*
 * ============================================================
 * CARGAR VEHÍCULO
 * ============================================================
 */
async function cargarVehiculo() {

    try {

        const respuesta =
            await fetch(
                '../../API/vehiculos/obtener.php?id=' +
                encodeURIComponent(idVehiculo),
                {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                }
            );


        const datos =
            await respuesta.json();


        if (
            !respuesta.ok ||
            !datos.ok
        ) {

            mensaje.textContent =
                datos.mensaje ||
                'No se pudo cargar el vehículo.';

            return;

        }


        const vehiculo =
            datos.vehiculo;


        document.getElementById(
            'matricula'
        ).value =
            vehiculo.matricula;


        document.getElementById(
            'tipo'
        ).value =
            vehiculo.id_tipo_vehiculo;


        document.getElementById(
            'estado_laboral'
        ).value =
            vehiculo.estado_laboral;


    } catch (error) {

        console.error(error);


        mensaje.textContent =
            'No se pudo conectar con el servidor.';

    }

}


/*
 * ============================================================
 * GUARDAR CAMBIOS
 * ============================================================
 */
formulario.addEventListener(
    'submit',
    async evento => {

        evento.preventDefault();


        mensaje.textContent = '';


        const matricula =
            document
                .getElementById('matricula')
                .value
                .trim();


        const idTipoVehiculo =
            selectTipo.value;


        const estadoLaboral =
            document
                .getElementById('estado_laboral')
                .value;


        if (
            matricula === '' ||
            idTipoVehiculo === '' ||
            estadoLaboral === ''
        ) {

            mensaje.textContent =
                'Complete todos los campos obligatorios.';

            return;

        }


        try {

            const respuesta =
                await fetch(
                    '../../API/vehiculos/actualizar.php',
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials:
                            'same-origin',

                        body:
                            JSON.stringify({

                                id_vehiculo:
                                    Number(
                                        idVehiculo
                                    ),

                                matricula:
                                    matricula,

                                id_tipo_vehiculo:
                                    Number(
                                        idTipoVehiculo
                                    ),

                                estado_laboral:
                                    estadoLaboral

                            })
                    }
                );


            const datos =
                await respuesta.json();


            if (
                !respuesta.ok ||
                !datos.ok
            ) {

                mensaje.textContent =
                    datos.mensaje ||
                    'No se pudieron guardar los cambios.';

                return;

            }


            mensaje.textContent =
                'Vehículo actualizado correctamente.';


            setTimeout(
                () => {

                    window.location.replace(
                        'vehiculos.html'
                    );

                },
                1000
            );


        } catch (error) {

            console.error(error);


            mensaje.textContent =
                'No se pudo conectar con el servidor.';

        }

    }
);


/*
 * ============================================================
 * SEGURIDAD + CARGA
 * ============================================================
 */
verificarAdministrador()
    .then(async autorizado => {

        if (!autorizado) {

            return;

        }


        if (!idVehiculo) {

            mensaje.textContent =
                'No se indicó el vehículo a editar.';

            return;

        }


        const tiposCargados =
            await cargarTipos();


        if (!tiposCargados) {

            return;

        }


        cargarVehiculo();

    });


</script>


    <script src="../js/preferencias.js"></script>
    <script src="../js/header.js"></script>
</body>

</html>
