<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>SIGSM - Crear Usuario</title>

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >
    <link rel="stylesheet" href="../css/tema.css">

    <script src="../js/csrf.js"></script>
</head>


<body>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar"></div>


<!-- ================= CONTENIDO ================= -->

<div class="main">


    <div class="header">

        <div class="header-left">

            <h2>
                Crear Usuario
            </h2>

        </div>


        <div class="header-right">

            <span class="user">
                Cargando...
            </span>

            <span class="role">
                Cargando...
            </span>

            <button
                class="logout"
                id="btnLogout"
                type="button"
            >
                Salir
            </button>

        </div>

    </div>


    <div class="content">

        <h2 class="titulo-seccion">
            Crear Usuario
        </h2>


        <div class="card card-medium">

            <form
                class="form"
                id="crearUsuarioForm"
            >


                <div class="form-group">

                    <label for="user">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="user"
                        name="user"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="ci">
                        CI
                    </label>

                    <input
                        type="text"
                        id="ci"
                        name="ci"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="apellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="text"
                        id="telefono"
                        name="telefono"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="id_rol">
                        Rol
                    </label>

                    <select
                        id="id_rol"
                        name="id_rol"
                        required
                    >

                        <option value="">
                            Seleccione un rol
                        </option>

                        <option value="1">
                            Administrador
                        </option>

                        <option value="2">
                            Operador
                        </option>

                    </select>

                </div>

                <p
                    id="mensaje"
                    role="alert"
                ></p>

                <div class="acciones-form">

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Crear usuario
                    </button>

                    <a href="usuarios.html">
                        <button
                            type="button"
                            class="btn-secondary"
                        >
                            Volver
                        </button>
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<!-- ================= Sidebar ================= -->

<script src="../js/admin-sidebar.js"></script>

<!-- ================= SEGURIDAD ================= -->

<script src="../js/admin-auth.js"></script>

<!-- ================= JS PROPIO ================= -->

<script>


const formulario =
    document.getElementById(
        'crearUsuarioForm'
    );


const mensaje =
    document.getElementById(
        'mensaje'
    );


/*
 * Crear usuario.
 */
formulario.addEventListener(
    'submit',
    async (evento) => {

        evento.preventDefault();


        mensaje.textContent = '';


        const user =
            document
                .getElementById('user')
                .value
                .trim();


        const ci =
            document
                .getElementById('ci')
                .value
                .trim();


        const nombre =
            document
                .getElementById('nombre')
                .value
                .trim();


        const apellido =
            document
                .getElementById('apellido')
                .value
                .trim();


        const telefono =
            document
                .getElementById('telefono')
                .value
                .trim();


        const email =
            document
                .getElementById('email')
                .value
                .trim();


        const password =
            document
                .getElementById('password')
                .value;


        const idRol =
            document
                .getElementById('id_rol')
                .value;


        if (
            user === '' ||
            ci === '' ||
            nombre === '' ||
            apellido === '' ||
            email === '' ||
            password === '' ||
            idRol === ''
        ) {

            mensaje.textContent =
                'Complete todos los campos obligatorios.';

            return;
        }


        if (
            password.length < 8
        ) {

            mensaje.textContent =
                'La contraseña debe tener al menos 8 caracteres.';

            return;
        }


        if (
            !email.includes('@')
        ) {

            mensaje.textContent =
                'Ingrese un email válido.';

            return;
        }


        try {

            const respuesta =
                await fetch(
                    '../../API/usuarios/crear.php',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        credentials:
                            'same-origin',

                        body:
                            JSON.stringify({

                                ci:
                                    ci,

                                nombre:
                                    nombre,

                                apellido:
                                    apellido,

                                telefono:
                                    telefono === ''
                                        ? null
                                        : telefono,

                                email:
                                    email,

                                user:
                                    user,

                                password:
                                    password,

                                id_rol:
                                    Number(idRol)

                            })
                    }
                );


            const datos =
                await respuesta.json();


            if (
                !respuesta.ok ||
                !datos.ok
            ) {

                mensaje.textContent =
                    datos.mensaje ||
                    'No se pudo crear el usuario.';

                return;
            }


            mensaje.textContent =
                'Usuario creado correctamente.';


            formulario.reset();


            setTimeout(() => {

                window.location.replace(
                    'usuarios.html'
                );

            }, 1500);


        } catch (error) {

            console.error(
                error
            );


            mensaje.textContent =
                'No se pudo conectar con el servidor.';

        }

    }
);

</script>


    <script src="../js/preferencias.js"></script>
    <script src="../js/header.js"></script>
</body>

</html>
